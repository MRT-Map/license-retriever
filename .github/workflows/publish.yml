name: Publish
on:
  workflow_dispatch:
  push:
    tags: ["**"]

permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: $/.github/workflows/test.yml
    permissions: 
      contents: read

  changelog-version:
    name: Extract changelog & version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: echo "version=$(cargo pkgid | cut -d '#' -f 2)" >> "$GITHUB_OUTPUT"
      - id: changelog
        run: |
          {
          echo 'changelog<<__EOF__'
          python -c "
          import os
          print('\n'.join(open('CHANGELOG.md').read().split('## v' + os.environ['VERSION'])[1].split('\n')[1:]).split('\n##')[0])
          "
          echo __EOF__
          } >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.version.outputs.version }}

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [test, changelog-version]
    if: github.event_name != 'pull_request' && !startsWith(github.ref_name, 'renovate/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          cache: false
          envs: ''
      - run: cargo package --locked
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4  # zizmor: ignore[superfluous-actions]
        with:
          tag_name: v${{ needs.changelog-version.outputs.version }}
          name: v${{ needs.changelog-version.outputs.version }}
          body: ${{ needs.changelog-version.outputs.changelog }}
          files: target/package/*.crate
          generate_release_notes: true

  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: test
    environment: crates
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  delete-github-release:
    name: Delete failed release
    runs-on: ubuntu-slim
    needs: [ test, changelog-version, github-release, crates-io ]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: gh release delete "v$TAG" --cleanup-tag -y
        env:
          TAG: ${{ needs.changelog-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
